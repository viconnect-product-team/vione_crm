services:
  frontend:
    image: ${FRONTEND_IMAGE_NAME:-vione-standalone-frontend}:latest
    pull_policy: never
    container_name: vione-frontend-prod
    restart: always
    env_file:
      - .env
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - NITRO_HOST=0.0.0.0
      - NEST_API_URL=http://backend:4000
    ports:
      - "127.0.0.1:${TARGET_PROD_PORT_FRONTEND:-5000}:8080"
    depends_on:
      - backend
    networks:
      - vione-network

  backend:
    image: ${BACKEND_IMAGE_NAME:-vione-standalone-backend}:latest
    pull_policy: never
    container_name: vione-backend-prod
    restart: always
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    user: "0:0"
    volumes:
      - vione-uploads-data:/app/uploads
    ports:
      - "127.0.0.1:${TARGET_PROD_PORT_BACKEND:-5001}:4000"
    depends_on:
      - minio
    networks:
      - vione-network

  minio:
    image: minio/minio:latest
    container_name: vione-minio-prod
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9050:9000"
      - "9051:9001"
    volumes:
      - vione-minio-data-prod:/data
    command: server /data --console-address ":9001"
    networks:
      vione-network:
        aliases:
          - minio
          - vione-minio-prod

volumes:
  vione-minio-data-prod:
    name: vione-minio-data-prod
    external: true
  vione-uploads-data:
    name: vione-uploads-data
    external: true

networks:
  vione-network:
    name: vione-network
    external: true
