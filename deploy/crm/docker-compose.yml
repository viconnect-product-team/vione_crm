services:
  crm-frontend:
    image: ${VIONE_CRM_FE_IMAGE:-vione-crm-frontend}:latest
    container_name: vione-crm-frontend-prod
    restart: always
    env_file:
      - .env.crm
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - NITRO_HOST=0.0.0.0
      - NEST_API_URL=http://vione-crm-backend:4000
      - VITE_APP_SCOPE=crm_platform
      - VITE_APP_NAME="ViOne Connect CRM 5.0"
      - VITE_APP_DEFAULT_ROUTE=/
    ports:
      - "${VIONE_CRM_PORT_FRONTEND:-5006}:8080"
    depends_on:
      - crm-backend
    networks:
      - vione-network

  crm-backend:
    image: ${VIONE_CRM_BE_IMAGE:-vione-crm-backend}:latest
    container_name: vione-crm-backend-prod
    restart: always
    env_file:
      - .env.crm
    environment:
      - NODE_ENV=production
      - PORT=4000
      - APP_SCOPE=crm_platform
    user: "0:0"
    volumes:
      - vione-uploads-data:/app/uploads
    ports:
      - "${VIONE_CRM_PORT_BACKEND:-5007}:4000"
    networks:
      vione-network:
        aliases:
          - backend
          - vione-crm-backend

volumes:
  vione-uploads-data:
    name: vione-uploads-data

networks:
  vione-network:
    name: vione-network
    external: true
