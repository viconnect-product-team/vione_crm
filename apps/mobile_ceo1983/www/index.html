<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>CLB Doanh Nhân CEO 1983 — HanoiBA</title>
  <meta name="theme-color" content="#003B95">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at 50% 30%, #003B95 0%, #00224F 60%, #001229 100%);
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      overflow: hidden;
    }
    .logo-container {
      position: relative;
      width: 110px;
      height: 110px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-glow {
      position: absolute;
      inset: -10px;
      background: radial-gradient(circle, rgba(217, 119, 6, 0.4) 0%, transparent 70%);
      border-radius: 50%;
      animation: pulse 2.5s infinite ease-in-out;
    }
    .logo-img {
      width: 90px;
      height: 90px;
      object-fit: contain;
      z-index: 2;
      filter: drop-shadow(0 6px 16px rgba(0,0,0,0.35));
    }
    .title {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 1px;
      color: #FFFFFF;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 13px;
      font-weight: 700;
      color: #F59E0B;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 30px;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-top-color: #F59E0B;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin-bottom: 16px;
    }
    .status-text {
      font-size: 12px;
      color: #93C5FD;
      font-weight: 500;
    }
    .btn-fallback {
      margin-top: 24px;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 12px;
      color: #FFFFFF;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      display: inline-block;
      transition: all 0.2s ease;
    }
    .btn-fallback:active {
      transform: scale(0.96);
      background: rgba(255, 255, 255, 0.2);
    }
    @keyframes pulse {
      0%, 100% { transform: scale(0.95); opacity: 0.5; }
      50% { transform: scale(1.15); opacity: 0.9; }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <div class="logo-glow"></div>
    <img src="ceo1983-official-logo.png" alt="Logo CEO 1983" class="logo-img">
  </div>
  
  <div class="title">CLB DOANH NHÂN CEO 1983</div>
  <div class="subtitle">Hội Doanh Nhân Trẻ Hà Nội (HanoiBA)</div>

  <div class="spinner"></div>
  <div class="status-text" id="status-msg">Đang kết nối phân hệ Hiệp hội...</div>

  <a href="http://14.225.217.232:5002/association" class="btn-fallback" id="manual-btn" style="display: none;">
    Bấm vào đây nếu không tự chuyển hướng
  </a>

  <script>
    var TARGET_URL = "http://14.225.217.232:5002/association";
    
    // Tự động chuyển hướng ngay lập tức vào App Hiệp Hội
    try {
      window.location.replace(TARGET_URL);
    } catch(e) {
      window.location.href = TARGET_URL;
    }

    // Fallback hiển thị nút bấm nếu mạng bị chậm
    setTimeout(function() {
      var btn = document.getElementById('manual-btn');
      if (btn) btn.style.display = 'inline-block';
      var msg = document.getElementById('status-msg');
      if (msg) msg.innerText = 'Chạm nút bên dưới để mở App Hiệp hội';
    }, 2500);
  </script>
</body>
</html>
