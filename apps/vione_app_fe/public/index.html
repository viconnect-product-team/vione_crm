<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ViOne Business Connect</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0b0f19;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    .logo-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .logo {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(216, 178, 130, 0.25);
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(216, 178, 130, 0.2);
      border-top-color: #D8B282;
      border-radius: 50%;
      animation: spin 0.9s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      margin-top: 12px;
    }
    .title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #FFF0D0 0%, #D8B282 50%, #B8860B 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      font-size: 13px;
      color: #8E9BAE;
      font-weight: 400;
      margin-top: -6px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <img class="logo" src="/vione-gold-192.png" alt="ViOne Logo" onerror="this.style.display='none'">
    <h1 class="title">ViOne</h1>
    <p class="subtitle">Hệ Sinh Thái Doanh Nghiệp Tinh Hoa</p>
    <div class="spinner"></div>
  </div>
  <script>
    if (window.location.pathname === '/' || window.location.pathname === '/index.html') {
      window.location.replace('/connect-app');
    }
  </script>
</body>
</html>
