<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ViOne Business Connect</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0b0f19;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(216, 178, 130, 0.2);
      border-top-color: #D8B282;
      border-radius: 50%;
      animation: spin 0.9s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      margin-top: 14px;
    }
    .title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #FFF0D0 0%, #D8B282 50%, #B8860B 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      font-size: 13px;
      color: #8E9BAE;
      margin-top: 4px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
    <h1 class="title">ViOne</h1>
    <p class="subtitle">Hệ Sinh Thái Doanh Nghiệp Tinh Hoa</p>
    <div class="spinner"></div>
  </div>
  <script>
    window.location.replace("https://14.225.217.232:5445/connect-app");
  </script>
</body>
</html>
